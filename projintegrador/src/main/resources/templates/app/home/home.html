<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mesas | Mesa &amp; Sabor</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="page">
    <div class="page-heading"><div><h1>Mesas</h1><p class="muted">Organize o salão e a capacidade de atendimento.</p></div><a class="button" th:href="@{/home/mesas/create}">+ Nova mesa</a></div>
    <div class="table-wrap" th:if="${!#lists.isEmpty(mesas)}"><table><thead><tr><th>Número</th><th>Lugares</th><th>Ações</th></tr></thead><tbody>
        <tr th:each="mesa : ${mesas}"><td th:text="${mesa.numero}"></td><td th:text="${mesa.quantidade}"></td><td><div class="actions"><a class="button button-secondary" th:href="@{/home/mesas/{id}/update(id=${mesa.id})}">Editar</a><form th:action="@{/home/mesas/{id}/delete(id=${mesa.id})}" method="post"><button class="button-danger" type="submit">Excluir</button></form></div></td></tr>
    </tbody></table></div>
    <div class="card empty" th:if="${#lists.isEmpty(mesas)}">Nenhuma mesa cadastrada. Comece adicionando uma mesa ao salão.</div>
</main>
</body>
</html>

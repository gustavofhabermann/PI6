<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Editar produto | Mesa &amp; Sabor</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments/nav :: nav}"></div>
<main class="page-narrow"><section class="card"><h1>Editar produto</h1><form th:action="@{/home/produtos/{id}/update(id=${produto.id})}" th:object="${produto}" method="post">
    <div class="field"><label for="nome">Nome</label><input id="nome" th:field="*{nome}" maxlength="100" required></div>
    <div class="field"><label for="categoria">Categoria</label><input id="categoria" th:field="*{categoria}" required></div>
    <div class="field"><label for="precoCompra">Preço de compra</label><input id="precoCompra" th:field="*{precoCompra}" type="number" min="0" step="0.01"></div>
    <div class="field"><label for="precoVenda">Preço de venda</label><input id="precoVenda" th:field="*{precoVenda}" type="number" min="0" step="0.01" required></div>
    <div class="field"><label for="quantidade">Quantidade em estoque</label><input id="quantidade" th:field="*{quantidade}" type="number" min="0" required></div>
    <div class="form-actions"><button type="submit">Salvar alterações</button><a class="button button-secondary" th:href="@{/home/produtos}">Cancelar</a></div>
</form></section></main></body></html>

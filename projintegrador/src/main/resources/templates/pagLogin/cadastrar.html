<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Criar conta | Mesa &amp; Sabor</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<main class="page-narrow">
    <a th:href="@{/}">← Voltar ao início</a>
    <section class="card" style="margin-top: 18px">
        <h1>Criar conta</h1><p class="muted">Cadastre o usuário que vai administrar o sistema.</p>
        <p class="alert" th:if="${param.erro == 'email'}">Este e-mail já está cadastrado.</p>
        <form th:action="@{/cadastro}" method="post">
            <div class="field"><label for="name">Nome</label><input id="name" name="name" type="text" autocomplete="name" required></div>
            <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div>
            <div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required></div>
            <button type="submit">Criar conta</button>
        </form>
        <p class="muted" style="margin-bottom: 0">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
    </section>
</main>
</body>
</html>

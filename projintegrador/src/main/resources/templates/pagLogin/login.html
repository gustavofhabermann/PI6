<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar | Mesa &amp; Sabor</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<main class="page-narrow">
    <a th:href="@{/}">← Voltar ao início</a>
    <section class="card" style="margin-top: 18px">
        <h1>Entrar</h1><p class="muted">Acesse o painel do seu estabelecimento.</p>
        <p class="alert" th:if="${param.erro}">E-mail ou senha inválidos.</p>
        <p class="alert" th:if="${param.logout}">Você saiu da sua conta.</p>
        <p class="alert" th:if="${param.cadastrado}">Conta criada. Entre com seu e-mail e senha.</p>
        <form th:action="@{/login}" method="post">
            <div class="field"><label for="username">E-mail</label><input id="username" name="username" type="email" autocomplete="username" required autofocus></div>
            <div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
            <button type="submit">Entrar</button>
        </form>
        <p class="muted" style="margin-bottom: 0">Ainda não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
    </section>
</main>
</body>
</html>
